<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Batalha Política LIVE</title><link rel="stylesheet" href="style.css"><style>main{max-width:900px;display:block}aside{max-width:850px;margin:auto}</style></head><body><main><aside><h2>🎛️ Controle da LIVE</h2><p id="status">Modo demonstração</p><div class="buttons"><button id="start">▶ Iniciar</button><button id="pause">⏸ Pausar</button><button id="reset">↻ Reiniciar</button><button id="music">♫ Suspense</button></div><label style="display:block;margin:12px 0">🔊 Volume da trilha <strong id="volume-value">65%</strong><input id="volume" type="range" min="0" max="100" value="65" step="1" style="display:block;width:100%;margin-top:8px" aria-label="Volume da trilha sonora"></label><label>Espectador<input id="viewer" placeholder="Nome do espectador" maxlength="24"></label><label>Lado<select id="target"><option value="0">Flávio Bolsonaro</option><option value="1">Lula</option></select></label><div class="buttons"><button data-event="like">❤️ Curtida</button><button data-event="comment">💬 Comentário</button><button data-event="rose">🌹 Rosa</button><button data-event="shield">⚡ Superenergia</button></div><h3>Ranking</h3><ol id="ranking"><li>Aguardando eventos</li></ol><p>Os botões simulam eventos. A conexão TikTok depende de uma LIVE ativa. Não representa pesquisa ou votação eleitoral.</p></aside><p><a href="live.html" target="_blank" style="color:#9ddaff">Abrir arena da LIVE ↗</a></p></main><script type="module" src="admin-client.js?v=3"></script></body></html>
